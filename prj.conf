CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_THREAD_NAME=y
# Keeps log output from corrupting the VT100 screen
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y
# fs_mount() in main() (and the first-mount format) overflows the default 1 KB stack
CONFIG_MAIN_STACK_SIZE=2048

# Partition Manager: size of the littlefs_storage partition
CONFIG_PM_PARTITION_SIZE_LITTLEFS=0x6000
